name: Build MiiNora OS from pinned upstream sources and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (leave blank for automatic version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: miinora-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-os:
    name: Build Debian armel system package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore project source from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'MiiNora-OS-*-SOURCE.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: MiiNora source archive not found in repository root." >&2
            ls -lah "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          python3 - "$ARCHIVE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/miinora-source-extract" <<'PYTHON'
          import pathlib, shutil, sys, zipfile
          archive, workspace, extract = map(pathlib.Path, sys.argv[1:])
          workspace = workspace.resolve()
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (extract / item.filename).resolve()
                  if extract.resolve() not in target.parents and target != extract.resolve():
                      raise SystemExit(f"Unsafe path in source archive: {item.filename}")
                  zf.extract(item, extract)
                  mode = (item.external_attr >> 16) & 0o777
                  if mode and not item.is_dir():
                      target.chmod(mode)
          candidates = [p for p in extract.iterdir() if p.is_dir()]
          source = candidates[0] if len(candidates) == 1 else extract
          required = ["VERSION", "tests/validate-static.sh", "os/build-rootfs.sh",
                      "os/scripts/package-3ds-boot-assets.sh", "installer/Makefile",
                      "installer/source/main.c", "scripts/generate-assets.py"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Source archive is incomplete: " + ", ".join(missing))
          for item in source.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = workspace / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          print(f"Restored source from {archive.name}")
          PYTHON
          chmod +x tests/validate-static.sh os/build-rootfs.sh os/scripts/package-3ds-boot-assets.sh os/install-on-linux-host.sh
          test -s os/build-rootfs.sh
          test -s installer/source/main.c

      - name: Reclaim GitHub runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo docker system prune -af --volumes || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          df -h /
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( AVAIL_KB < 6000000 )); then
            echo "ERROR: Less than 6 GiB free before rootfs build." >&2
            exit 1
          fi

      - name: Install rootfs build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            curl ca-certificates file python3 python3-pil tar gzip coreutils \
            findutils binutils gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            gcc-arm-none-eabi binutils-arm-none-eabi build-essential git flex bison \
            bc libssl-dev libelf-dev libncurses-dev kmod python3-venv python3-dev
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          sudo update-binfmts --enable qemu-arm || true

      - name: Run source static validation
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Patch rootfs packaging safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("os/build-rootfs.sh")
          s = p.read_text()
          # Stop copying live runner pseudo-filesystems into the target rootfs.
          # The source script mounts /dev, /proc and /sys for chroot package setup.
          overlay_copy = 'cp -a "$ROOT/os/rootfs-overlay/." "$ROOTFS/"'
          if overlay_copy not in s:
              raise SystemExit("Expected rootfs overlay copy not found; refusing unsafe automatic patch.")
          s = s.replace(
              overlay_copy,
              'cleanup\n' + overlay_copy,
              1,
          )
          old_copy = 'cp -a "$ROOTFS/." "$OUT/package/"'
          if old_copy not in s:
              raise SystemExit("Expected rootfs staging copy not found; refusing unsafe automatic patch.")
          s = s.replace(old_copy, 'mkdir -p "$OUT/package"', 1)
          # Archive directly from the generated rootfs: avoids a second full copy.
          # Exclude contents of virtual filesystems but retain their mount-point directories.
          lines = s.splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if re.match(r"\s*tar\b", line)), None)
          if start is None:
              raise SystemExit("Could not find the rootfs tar command; refusing partial patch.")
          end = start
          while end < len(lines) and "MiiNora-Debian-Bookworm-armel-rootfs.tar.gz" not in "".join(lines[start:end + 1]):
              end += 1
          if end >= len(lines):
              raise SystemExit("Could not find the rootfs archive output path; refusing partial patch.")
          block = "".join(lines[start:end + 1])
          if '-C "$OUT/package"' not in block:
              raise SystemExit("Rootfs tar command does not use the expected staging directory.")
          block = re.sub(
              r"^([ \t]*)tar\b",
              r"\1tar --one-file-system --numeric-owner --exclude='./proc/*' --exclude='./sys/*' --exclude='./dev/*' --exclude='./run/*'",
              block,
              count=1,
              flags=re.M,
          )
          block = block.replace('-C "$OUT/package"', '-C "$ROOTFS"', 1)
          lines[start:end + 1] = [block]
          s = "".join(lines)
          p.write_text(s)
          print("Rootfs archive now reads directly from ROOTFS and excludes virtual filesystem contents.")
          PY
          bash -n os/build-rootfs.sh
          grep -Fq 'cleanup' os/build-rootfs.sh
          if grep -Fq 'cp -a "$ROOTFS/." "$OUT/package/"' os/build-rootfs.sh; then
            echo "ERROR: unsafe rootfs copy remains." >&2
            exit 1
          fi
          echo "Verified: /dev, /proc and /sys are unmounted before rootfs packaging."

      - name: Build minimal Debian Bookworm armel root filesystem
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo bash ./os/build-rootfs.sh "$RUNNER_TEMP/miinora-rootfs"
          df -h /
          du -sh "$RUNNER_TEMP/miinora-rootfs" || true
          test -s "$RUNNER_TEMP/miinora-rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"

      - name: Check out pinned 3DS Linux kernel source
        uses: actions/checkout@v4
        with:
          repository: Peugeot205GTI/linux-3DS
          ref: bea91bcc5b67151eb439b31a73f53083dcd72c2b
          path: upstream/linux-3DS
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned ARM9 firmware source
        uses: actions/checkout@v4
        with:
          repository: Peugeot205GTI/arm9linuxfw
          ref: 95474297b6df406889bdf6cde02cba1024cb3ce3
          path: upstream/arm9linuxfw
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned FIRM Linux Loader source
        uses: actions/checkout@v4
        with:
          repository: Peugeot205GTI/firm_linux_loader
          ref: e5046868faf125bd1580ca1f24b63b823c5dd9ed
          path: upstream/firm_linux_loader
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned firmtool source
        uses: actions/checkout@v4
        with:
          repository: TuxSH/firmtool
          ref: fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          path: upstream/firmtool
          fetch-depth: 1
          persist-credentials: false

      - name: Build kernel, matching modules, ARM9 firmware and FIRM loader
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/upstream/linux-3DS"
          ARM9_DIR="$GITHUB_WORKSPACE/upstream/arm9linuxfw"
          LOADER_DIR="$GITHUB_WORKSPACE/upstream/firm_linux_loader"
          FIRMTOOL_DIR="$GITHUB_WORKSPACE/upstream/firmtool"
          PACKAGE="$RUNNER_TEMP/miinora-os-package"
          MODULES_STAGE="$RUNNER_TEMP/miinora-kernel-modules"
          FIRMTOOL_VENV="$RUNNER_TEMP/firmtool-venv"

          mkdir -p "$PACKAGE/fat32/linux" "$PACKAGE/fat32/luma/payloads" \
            "$PACKAGE/modules" "$MODULES_STAGE"

          echo '== Build the Nintendo 3DS kernel from the pinned upstream commit =='
          make -C "$KERNEL_DIR" ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- nintendo3ds_defconfig
          grep -qx 'CONFIG_MODULES=y' "$KERNEL_DIR/.config"
          grep -qx 'CONFIG_ATH6KL=m' "$KERNEL_DIR/.config"
          grep -qx 'CONFIG_ATH6KL_SDIO=m' "$KERNEL_DIR/.config"
          make -C "$KERNEL_DIR" -j"$(nproc)" \
            ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- zImage dtbs modules

          KERNEL_RELEASE="$(make -s -C "$KERNEL_DIR" ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi- kernelrelease)"
          test -n "$KERNEL_RELEASE"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

          test -s "$KERNEL_DIR/arch/arm/boot/zImage"
          test -s "$KERNEL_DIR/arch/arm/boot/dts/nintendo3ds_ctr.dtb"
          test -s "$KERNEL_DIR/arch/arm/boot/dts/nintendo3ds_ktr.dtb"

          echo '== Install the modules built from that exact kernel config and commit =='
          make -C "$KERNEL_DIR" ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
            modules_install INSTALL_MOD_PATH="$MODULES_STAGE"
          depmod -b "$MODULES_STAGE" "$KERNEL_RELEASE"
          MODULE_DIR="$MODULES_STAGE/lib/modules/$KERNEL_RELEASE"
          test -d "$MODULE_DIR"
          MODULE_COUNT="$(find "$MODULE_DIR" -type f \
            \( -name '*.ko' -o -name '*.ko.xz' -o -name '*.ko.gz' \) | wc -l)"
          if [[ "$MODULE_COUNT" -lt 2 ]]; then
            echo 'ERROR: expected the 3DS Wi-Fi kernel modules were not built.' >&2
            exit 1
          fi
          find "$MODULE_DIR" -type f -name 'ath6kl_core.ko*' -print -quit | grep -q .
          find "$MODULE_DIR" -type f -name 'ath6kl_sdio.ko*' -print -quit | grep -q .
          tar --sort=name --mtime='UTC 2024-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$MODULES_STAGE" -czf "$PACKAGE/modules/3ds-modules.tar" lib/modules
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | \
            grep -Eq '^lib/modules/.+\.ko(\.(xz|gz))?$'

          echo '== Build the upstream ARM9 firmware =='
          make -C "$ARM9_DIR" -j"$(nproc)"
          test -s "$ARM9_DIR/arm9linuxfw.elf"
          test -s "$ARM9_DIR/arm9linuxfw.bin"
          arm-none-eabi-readelf -h "$ARM9_DIR/arm9linuxfw.elf" | grep -q 'Machine:.*ARM'
          # The validated upstream binary in the previous successful release was 2,288 bytes.
          test "$(stat -c %s "$ARM9_DIR/arm9linuxfw.bin")" -gt 1024

          echo '== Install firmtool in an isolated Python environment and build the loader =='
          python3 -m venv "$FIRMTOOL_VENV"
          "$FIRMTOOL_VENV/bin/python" -m pip install --upgrade pip setuptools wheel
          "$FIRMTOOL_VENV/bin/python" -m pip install "$FIRMTOOL_DIR"
          export PATH="$FIRMTOOL_VENV/bin:$PATH"
          make -C "$LOADER_DIR" CC=arm-none-eabi-gcc
          test -s "$LOADER_DIR/firm_linux_loader.firm"
          test "$(stat -c %s "$LOADER_DIR/firm_linux_loader.firm")" -gt 4096

          echo '== Assemble matching boot files =='
          install -D -m 0644 "$KERNEL_DIR/arch/arm/boot/zImage" \
            "$PACKAGE/fat32/linux/zImage"
          install -D -m 0644 "$KERNEL_DIR/arch/arm/boot/dts/nintendo3ds_ctr.dtb" \
            "$PACKAGE/fat32/linux/nintendo3ds_ctr.dtb"
          install -D -m 0644 "$KERNEL_DIR/arch/arm/boot/dts/nintendo3ds_ktr.dtb" \
            "$PACKAGE/fat32/linux/nintendo3ds_ktr.dtb"
          install -D -m 0644 "$ARM9_DIR/arm9linuxfw.bin" \
            "$PACKAGE/fat32/linux/arm9linuxfw.bin"
          # Keep the Y-button payload naming used by the prior working 3DS-Linux bundle.
          install -D -m 0644 "$LOADER_DIR/firm_linux_loader.firm" \
            "$PACKAGE/fat32/luma/payloads/y_firm_linux_loader.firm"

          cat > "$PACKAGE/UPSTREAM-SOURCES.txt" <<'SOURCES'
          Built from pinned upstream source revisions:
            Linux kernel: https://github.com/Peugeot205GTI/linux-3DS
              commit bea91bcc5b67151eb439b31a73f53083dcd72c2b
            ARM9 firmware: https://github.com/Peugeot205GTI/arm9linuxfw
              commit 95474297b6df406889bdf6cde02cba1024cb3ce3
            FIRM Linux Loader: https://github.com/Peugeot205GTI/firm_linux_loader
              commit e5046868faf125bd1580ca1f24b63b823c5dd9ed
            firmtool: https://github.com/TuxSH/firmtool
              commit fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          Kernel modules were compiled and installed from the same kernel commit and configuration.
          SOURCES
          printf 'Kernel release: %s\nKernel modules: %s\n' \
            "$KERNEL_RELEASE" "$MODULE_COUNT" > "$PACKAGE/BUILD-INFO.txt"
          mkdir -p "$PACKAGE/licenses"
          install -m 0644 "$KERNEL_DIR/COPYING" "$PACKAGE/licenses/linux-3DS-COPYING"
          install -m 0644 "$ARM9_DIR/LICENSE.txt" "$PACKAGE/licenses/arm9linuxfw-LICENSE.txt"
          install -m 0644 "$LOADER_DIR/license.txt" "$PACKAGE/licenses/firm_linux_loader-LICENSE.txt"
          install -m 0644 "$FIRMTOOL_DIR/LICENSE" "$PACKAGE/licenses/firmtool-LICENSE.txt"

          echo "Built kernel $KERNEL_RELEASE with $MODULE_COUNT module files."
          echo 'All upstream inputs are pinned; no 3dslinux.org binary download is used.'

      - name: Assemble and validate OS release package
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/miinora-rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"
          PACKAGE="$RUNNER_TEMP/miinora-os-package"
          test -s "$ROOTFS"
          install -D -m 0644 "$ROOTFS" "$PACKAGE/rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"
          cp VERSION "$PACKAGE/VERSION"
          cat > "$PACKAGE/README.md" <<'README'
          # MiiNora OS — Old Nintendo 3DS

          This bundle contains a Debian Bookworm armel root filesystem and boot files
          built for the original Nintendo 3DS (CTR). The Linux kernel, matching kernel
          modules, ARM9 firmware, and FIRM Linux Loader are compiled from the pinned
          upstream source revisions listed in `UPSTREAM-SOURCES.txt`.

          Check `manifest.json`, `BUILD-INFO.txt`, and `UPSTREAM-SOURCES.txt` for build
          provenance. Upstream license files are in `licenses/`.

          Installation remains manual. Back up the SD card and follow the project's
          installation documentation before changing partitions or copying files.
          This release does not format or repartition an SD card.
          README
          cat > "$PACKAGE/manifest.json" <<'JSON'
          {
            "name": "MiiNora OS",
            "version": "0.2.0-alpha",
            "target": "Nintendo 3DS Old model (CTR)",
            "userspace": "Debian Bookworm armel",
            "kernel_source": "Peugeot205GTI/linux-3DS at bea91bcc5b67151eb439b31a73f53083dcd72c2b",
            "kernel_modules": "Built from the same pinned kernel source and configuration",
            "arm9_firmware": "Peugeot205GTI/arm9linuxfw at 95474297b6df406889bdf6cde02cba1024cb3ce3",
            "bootloader": "Peugeot205GTI/firm_linux_loader at e5046868faf125bd1580ca1f24b63b823c5dd9ed",
            "firmtool": "TuxSH/firmtool at fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1",
            "root_filesystem": "ext4",
            "installer_note": "The CIA downloads the package to FAT32; install the rootfs to the prepared ext4 partition with os/install-on-linux-host.sh."
          }
          JSON
          test -s "$PACKAGE/fat32/linux/zImage"
          test -s "$PACKAGE/fat32/linux/nintendo3ds_ctr.dtb"
          test -s "$PACKAGE/fat32/linux/nintendo3ds_ktr.dtb"
          test -s "$PACKAGE/fat32/linux/arm9linuxfw.bin"
          test -s "$PACKAGE/fat32/luma/payloads/y_firm_linux_loader.firm"
          test -s "$PACKAGE/modules/3ds-modules.tar"
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | grep -Eq '^lib/modules/.+\.ko(\.xz|\.gz)?$'
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | grep -Eq '(^|/)ath6kl_core\.ko(\.(xz|gz))?$'
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | grep -Eq '(^|/)ath6kl_sdio\.ko(\.(xz|gz))?$'
          ! find "$PACKAGE/fat32" -type l -print -quit | grep -q .
          ! find "$PACKAGE/fat32" -type f -name boot.firm -print -quit | grep -q .
          test "$(stat -c %s "$PACKAGE/fat32/linux/zImage")" -gt 524288
          test "$(stat -c %s "$PACKAGE/fat32/linux/nintendo3ds_ctr.dtb")" -gt 4096
          test "$(stat -c %s "$PACKAGE/fat32/linux/nintendo3ds_ktr.dtb")" -gt 4096
          test "$(stat -c %s "$PACKAGE/fat32/linux/arm9linuxfw.bin")" -gt 1024
          test "$(stat -c %s "$PACKAGE/fat32/luma/payloads/y_firm_linux_loader.firm")" -gt 4096
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | grep -Fq "lib/modules/$KERNEL_RELEASE/"
          ROOTFS_TMP="$RUNNER_TEMP/rootfs-check"
          mkdir -p "$ROOTFS_TMP"
          tar -xzf "$ROOTFS" -C "$ROOTFS_TMP" ./usr/bin/dash
          readelf -h "$ROOTFS_TMP/usr/bin/dash" | grep -q 'Machine:.*ARM'
          rm -rf "$ROOTFS_TMP"
          echo "Disk usage before OS package archive:"
          df -h /
          du -sh "$PACKAGE" "$RUNNER_TEMP/miinora-rootfs" || true
          mkdir -p dist
          tar --sort=name --mtime='UTC 2024-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$PACKAGE" -czf dist/MiiNora-OS-Package.tar.gz .
          test "$(stat -c %s dist/MiiNora-OS-Package.tar.gz)" -gt 10485760
          sha256sum dist/MiiNora-OS-Package.tar.gz > dist/MiiNora-OS-Package.tar.gz.sha256
          file dist/MiiNora-OS-Package.tar.gz
          du -h dist/MiiNora-OS-Package.tar.gz

      - name: Upload OS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: miinora-os-package
          path: |
            dist/MiiNora-OS-Package.tar.gz
            dist/MiiNora-OS-Package.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-installer:
    name: Build native 3DS CIA and 3DSX
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:20260610
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore project source from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'MiiNora-OS-*-SOURCE.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: MiiNora source archive not found in repository root." >&2
            exit 1
          fi
          python3 - "$ARCHIVE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/miinora-source-extract" <<'PYTHON'
          import pathlib, shutil, sys, zipfile
          archive, workspace, extract = map(pathlib.Path, sys.argv[1:])
          workspace = workspace.resolve()
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (extract / item.filename).resolve()
                  if extract.resolve() not in target.parents and target != extract.resolve():
                      raise SystemExit(f"Unsafe path in source archive: {item.filename}")
                  zf.extract(item, extract)
                  mode = (item.external_attr >> 16) & 0o777
                  if mode and not item.is_dir():
                      target.chmod(mode)
          candidates = [p for p in extract.iterdir() if p.is_dir()]
          source = candidates[0] if len(candidates) == 1 else extract
          required = ["VERSION", "tests/validate-static.sh", "os/build-rootfs.sh",
                      "os/scripts/package-3ds-boot-assets.sh", "installer/Makefile",
                      "installer/source/main.c", "scripts/generate-assets.py"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Source archive is incomplete: " + ", ".join(missing))
          for item in source.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = workspace / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          PYTHON
          chmod +x tests/validate-static.sh os/build-rootfs.sh os/scripts/package-3ds-boot-assets.sh os/install-on-linux-host.sh
          test -s installer/source/main.c

      - name: Install Python image dependency for static validation
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil

      - name: Run source static validation
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Install build utilities and verify devkitARM tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip zip file
          apt-get install -y --no-install-recommends binutils-arm-none-eabi || true
          test -n "${DEVKITPRO:-}"
          test -n "${DEVKITARM:-}"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          STRIP="$DEVKITARM/bin/arm-none-eabi-strip"
          if [[ ! -x "$STRIP" ]]; then STRIP="$(command -v arm-none-eabi-strip || true)"; fi
          if [[ -z "$STRIP" || ! -x "$STRIP" ]]; then
            echo "ERROR: arm-none-eabi-strip is missing." >&2
            find "$DEVKITPRO" -maxdepth 5 -name 'arm-none-eabi-strip' -print || true
            exit 1
          fi
          echo "ARM_STRIP=$STRIP" >> "$GITHUB_ENV"
          test -f "$DEVKITARM/3ds_rules"
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          "$STRIP" --version

      - name: Run source static validation again
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Generate custom MiiNora branding assets
        shell: bash
        run: python3 scripts/generate-assets.py

      - name: Build native installer
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", tag):
              raise SystemExit("Invalid release tag")
          source = Path("installer/source/main.c")
          text = source.read_text()
          text = re.sub(r'#define PACKAGE_URL "[^"]+"',
                        f'#define PACKAGE_URL "https://github.com/sl4m3d/miinoraOS/releases/download/{tag}/MiiNora-OS-Package.tar.gz"',
                        text, count=1)
          source.write_text(text)
          PYCODE
          if ! make -C installer clean all 2>&1 | tee "$RUNNER_TEMP/miinora-installer-build.log"; then
            echo "Installer compilation failed. Last 160 lines follow:" >&2
            tail -n 160 "$RUNNER_TEMP/miinora-installer-build.log" >&2 || true
            exit 1
          fi
          test -s installer/MiiNora-Installer.elf
          test -s installer/MiiNora-Installer.3dsx

      - name: Download CIA packaging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/3ds-tools"
          cd "$RUNNER_TEMP/3ds-tools"
          curl --fail --show-error --silent --location --http1.1 \
            --connect-timeout 20 --max-time 240 --speed-limit 1024 --speed-time 30 \
            --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 600 \
            -o makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl --fail --show-error --silent --location --http1.1 \
            --connect-timeout 20 --max-time 240 --speed-limit 1024 --speed-time 30 \
            --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 600 \
            -o bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          mkdir makerom bannertool
          unzip -q makerom.zip -d makerom
          unzip -q bannertool.zip 'linux-x86_64/bannertool' -d bannertool
          MAKEROM_BIN="$(find makerom -type f -name makerom -print -quit)"
          BANNER_BIN="bannertool/linux-x86_64/bannertool"
          test -n "$MAKEROM_BIN"
          test -s "$BANNER_BIN"
          chmod +x "$MAKEROM_BIN" "$BANNER_BIN"
          echo "MAKEROM=$RUNNER_TEMP/3ds-tools/$MAKEROM_BIN" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$RUNNER_TEMP/3ds-tools/$BANNER_BIN" >> "$GITHUB_ENV"

      - name: Package CIA and 3DSX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$BANNERTOOL" makesmdh -s "MiiNora Installer" -l "MiiNora OS setup utility" -p "sl4m3d" -i installer/assets/icon.png -o dist/MiiNora.smdh
          "$BANNERTOOL" makebanner -i installer/assets/banner.png -a installer/assets/banner.wav -o dist/MiiNora.bnr
          "$ARM_STRIP" installer/MiiNora-Installer.elf
          cat > dist/MiiNora-Installer.rsf <<'RSF'
          BasicInfo:
            Title: "MiiNora Installer"
            ProductCode: "MiiNora"
            Logo: Homebrew
          TitleInfo:
            Category: Application
            UniqueId: 0xF00A1
          Option:
            UseOnSD: true
            FreeProductCode: true
            MediaFootPadding: false
            EnableCrypt: false
            EnableCompress: true
          RSF
          "$MAKEROM" -f cia -o dist/MiiNora-Installer.cia -rsf dist/MiiNora-Installer.rsf -target t -exefslogo \
            -elf installer/MiiNora-Installer.elf -icon dist/MiiNora.smdh -banner dist/MiiNora.bnr -desc app:4
          cp installer/MiiNora-Installer.3dsx dist/
          cp README.md VERSION dist/
          (cd "$GITHUB_WORKSPACE" && zip -qr "$GITHUB_WORKSPACE/dist/MiiNora-Source.zip" . \
            -x '.git/*' 'dist/*' '*/__pycache__/*' '*.pyc')
          test -s dist/MiiNora-Installer.cia
          test -s dist/MiiNora-Installer.3dsx
          test -s dist/MiiNora-Source.zip
          file dist/MiiNora-Installer.cia dist/MiiNora-Installer.3dsx

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: miinora-installer
          path: |
            dist/MiiNora-Installer.cia
            dist/MiiNora-Installer.3dsx
            dist/MiiNora-Source.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish complete MiiNora release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-os, build-installer]
    steps:
      - name: Download OS package
        uses: actions/download-artifact@v4
        with:
          name: miinora-os-package
          path: release/os

      - name: Download installer files
        uses: actions/download-artifact@v4
        with:
          name: miinora-installer
          path: release/installer

      - name: Assemble checksums and verify release contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/os/* dist/
          cp release/installer/* dist/
          test -s dist/MiiNora-OS-Package.tar.gz
          test -s dist/MiiNora-Installer.cia
          test -s dist/MiiNora-Installer.3dsx
          test -s dist/MiiNora-Source.zip
          (cd dist && sha256sum MiiNora-OS-Package.tar.gz MiiNora-Installer.cia MiiNora-Installer.3dsx MiiNora-Source.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
          name: MiiNora OS ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/MiiNora-Installer.cia
            dist/MiiNora-Installer.3dsx
            dist/MiiNora-OS-Package.tar.gz
            dist/MiiNora-OS-Package.tar.gz.sha256
            dist/MiiNora-Source.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full release bundle for CI inspection
        uses: actions/upload-artifact@v4
        with:
          name: MiiNora-Release-Bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
