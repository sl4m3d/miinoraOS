name: Build MiiNora OS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (leave blank for automatic version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: miinora-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-os:
    name: Build Debian armel system package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore project source from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'MiiNora-OS-*-SOURCE.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: MiiNora source archive not found in repository root." >&2
            ls -lah "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          python3 - "$ARCHIVE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/miinora-source-extract" <<'PYTHON'
          import pathlib, shutil, sys, zipfile
          archive, workspace, extract = map(pathlib.Path, sys.argv[1:])
          workspace = workspace.resolve()
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (extract / item.filename).resolve()
                  if extract.resolve() not in target.parents and target != extract.resolve():
                      raise SystemExit(f"Unsafe path in source archive: {item.filename}")
                  zf.extract(item, extract)
                  mode = (item.external_attr >> 16) & 0o777
                  if mode and not item.is_dir():
                      target.chmod(mode)
          candidates = [p for p in extract.iterdir() if p.is_dir()]
          source = candidates[0] if len(candidates) == 1 else extract
          required = ["VERSION", "tests/validate-static.sh", "os/build-rootfs.sh",
                      "os/scripts/package-3ds-boot-assets.sh", "installer/Makefile",
                      "installer/source/main.c", "scripts/generate-assets.py"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Source archive is incomplete: " + ", ".join(missing))
          for item in source.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = workspace / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          print(f"Restored source from {archive.name}")
          PYTHON
          chmod +x tests/validate-static.sh os/build-rootfs.sh os/scripts/package-3ds-boot-assets.sh os/install-on-linux-host.sh
          test -s os/build-rootfs.sh
          test -s installer/source/main.c

      - name: Install resilient upstream 3DS asset downloader
        shell: bash
        run: |
          set -euo pipefail
          cat > os/scripts/package-3ds-boot-assets.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if [[ $# -ne 1 ]]; then
            echo "Usage: $0 <output-package-directory>" >&2
            exit 2
          fi

          OUT_INPUT="$1"
          mkdir -p "$OUT_INPUT"
          OUT="$(cd "$OUT_INPUT" && pwd)"
          WORK="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/miinora-3ds-boot-assets"
          mkdir -p "$WORK"

          # The official 3DS-Linux downloads page publishes these two archives.
          # Environment overrides exist only to make local regression tests possible.
          SD_URL="${MIINORA_SD_FILES_URL:-https://3dslinux.org/files/sd_files.tar.gz}"
          MODULES_URL="${MIINORA_MODULES_URL:-https://3dslinux.org/files/modules.tar}"
          SD_ARCHIVE="$WORK/sd_files.tar.gz"
          MODULES_ARCHIVE="$WORK/modules.tar"

          validate_archive() {
            local archive="$1"
            local kind="$2"

            python3 - "$archive" "$kind" <<'PYTHON'
          import pathlib
          import re
          import sys
          import tarfile

          archive_path = pathlib.Path(sys.argv[1])
          kind = sys.argv[2]

          try:
              mode = "r:gz" if kind == "sd" else "r:*"
              with tarfile.open(archive_path, mode) as tf:
                  members = tf.getmembers()
          except Exception as exc:
              raise SystemExit(f"Archive cannot be opened ({kind}): {exc}")

          if not members:
              raise SystemExit(f"Archive is empty ({kind}).")

          for member in members:
              name = member.name.replace("\\", "/")
              components = [part for part in name.split("/") if part not in ("", ".")]
              if name.startswith("/") or ".." in components:
                  raise SystemExit(f"Unsafe path in upstream archive: {member.name!r}")

          if kind == "sd":
              required = {
                  "zImage": 512 * 1024,
                  "nintendo3ds_ctr.dtb": 4096,
                  "arm9linuxfw.bin": 2048,
                  "firm_linux_loader.firm": 4096,
              }
              for basename, minimum_size in required.items():
                  matches = [m for m in members if m.isfile() and pathlib.PurePosixPath(m.name).name == basename]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected exactly one regular {basename} in sd_files.tar.gz; found {len(matches)}."
                      )
                  if matches[0].size <= minimum_size:
                      raise SystemExit(f"Upstream {basename} is unexpectedly small ({matches[0].size} bytes).")
          else:
              modules = []
              for member in members:
                  if not member.isfile():
                      continue
                  name = member.name
                  while name.startswith("./"):
                      name = name[2:]
                  if name.startswith("lib/modules/") and re.search(r"\.ko(?:\.(?:xz|gz))?$", name):
                      modules.append(name)
              if not modules:
                  raise SystemExit("modules.tar contains no lib/modules/*.ko, *.ko.xz or *.ko.gz files.")

          print(f"Validated {kind} archive: {archive_path.stat().st_size} bytes, {len(members)} entries")
          PYTHON
          }

          download_archive() {
            local url="$1"
            local destination="$2"
            local kind="$3"
            local partial="${destination}.part"
            local attempt delay rc

            for attempt in 1 2 3 4 5 6; do
              local args=(
                --fail
                --show-error
                --silent
                --location
                --http1.1
                --connect-timeout 20
                --max-time 600
                --retry 3
                --retry-connrefused
                --retry-all-errors
                --retry-delay 3
                --retry-max-time 60
                --speed-limit 1024
                --speed-time 30
                --keepalive-time 15
                --header 'Accept-Encoding: identity'
                --output "$partial"
              )

              if [[ -s "$partial" ]]; then
                args+=(--continue-at -)
                echo "[$kind] Resume attempt $attempt/6 from $(stat -c %s "$partial") bytes."
              else
                echo "[$kind] Download attempt $attempt/6."
              fi

              if curl "${args[@]}" "$url"; then
                if validate_archive "$partial" "$kind"; then
                  mv -f -- "$partial" "$destination"
                  echo "[$kind] Download complete: $(stat -c %s "$destination") bytes."
                  return 0
                fi
                echo "[$kind] Download returned an invalid archive; deleting it before retry." >&2
                rm -f -- "$partial"
              else
                rc=$?
                echo "[$kind] curl failed with exit code $rc." >&2
                # Exit 33 means the server refused a byte-range resume. Restart cleanly.
                if [[ "$rc" -eq 33 ]]; then
                  echo "[$kind] Server does not support this resume request; restarting from byte zero." >&2
                  rm -f -- "$partial"
                fi
              fi

              if [[ "$attempt" -lt 6 ]]; then
                case "$attempt" in
                  1) delay=5 ;;
                  2) delay=10 ;;
                  3) delay=20 ;;
                  4) delay=40 ;;
                  *) delay=60 ;;
                esac
                echo "[$kind] Waiting ${delay}s before retry."
                sleep "$delay"
              fi
            done

            echo "ERROR: Could not retrieve a valid official 3DS-Linux ${kind} archive after 6 attempts." >&2
            echo "No replacement kernel, DTB, firmware or modules were generated." >&2
            return 1
          }

          # A stalled connection is stopped after 30 seconds below 1 KiB/s. Partial
          # downloads are retained and resumed with HTTP Range where the server allows it.
          download_archive "$SD_URL" "$SD_ARCHIVE" sd
          download_archive "$MODULES_URL" "$MODULES_ARCHIVE" modules

          mkdir -p "$OUT/fat32/linux" "$OUT/fat32/luma/payloads" "$OUT/modules"

          python3 - "$SD_ARCHIVE" "$MODULES_ARCHIVE" "$OUT" <<'PYTHON'
          import pathlib
          import shutil
          import sys
          import tarfile

          sd_path = pathlib.Path(sys.argv[1])
          modules_path = pathlib.Path(sys.argv[2])
          out = pathlib.Path(sys.argv[3])

          mapping = {
              "zImage": (out / "fat32/linux/zImage", 512 * 1024),
              "nintendo3ds_ctr.dtb": (out / "fat32/linux/nintendo3ds_ctr.dtb", 4096),
              "arm9linuxfw.bin": (out / "fat32/linux/arm9linuxfw.bin", 2048),
              "firm_linux_loader.firm": (out / "fat32/luma/payloads/firm_linux_loader.firm", 4096),
          }

          with tarfile.open(sd_path, "r:gz") as tf:
              members = tf.getmembers()
              for basename, (destination, minimum_size) in mapping.items():
                  matches = [m for m in members if m.isfile() and pathlib.PurePosixPath(m.name).name == basename]
                  if len(matches) != 1:
                      raise SystemExit(f"Cannot safely select {basename}: found {len(matches)} matching files.")
                  member = matches[0]
                  if member.size <= minimum_size:
                      raise SystemExit(f"Refusing undersized {basename}: {member.size} bytes.")
                  stream = tf.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"Could not read {basename} from the official SD archive.")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with stream, destination.open("wb") as output:
                      shutil.copyfileobj(stream, output)
                  if destination.stat().st_size != member.size:
                      raise SystemExit(f"Extracted size mismatch for {basename}.")
                  print(f"Installed {destination.relative_to(out)} ({member.size} bytes)")

          with tarfile.open(modules_path, "r:*") as tf:
              members = tf.getmembers()
              module_names = []
              for member in members:
                  if not member.isfile():
                      continue
                  name = member.name
                  while name.startswith("./"):
                      name = name[2:]
                  if name.startswith("lib/modules/") and name.endswith((".ko", ".ko.xz", ".ko.gz")):
                      module_names.append(name)
              if not module_names:
                  raise SystemExit("Refusing to package modules.tar without actual kernel module files.")

          shutil.copy2(modules_path, out / "modules/3ds-modules.tar")
          print(f"Packaged {len(module_names)} kernel modules from the official archive.")
          PYTHON

          # Final output gate: every expected binary must exist and remain non-empty.
          test "$(stat -c %s "$OUT/fat32/linux/zImage")" -gt 524288
          test "$(stat -c %s "$OUT/fat32/linux/nintendo3ds_ctr.dtb")" -gt 4096
          test "$(stat -c %s "$OUT/fat32/linux/arm9linuxfw.bin")" -gt 2048
          test "$(stat -c %s "$OUT/fat32/luma/payloads/firm_linux_loader.firm")" -gt 4096
          test -s "$OUT/modules/3ds-modules.tar"
          sha256sum "$SD_ARCHIVE" "$MODULES_ARCHIVE" | tee "$OUT/upstream-SHA256SUMS"
          echo "Official 3DS-Linux boot assets and matching modules packaged successfully."
          SCRIPT
          chmod +x os/scripts/package-3ds-boot-assets.sh
          bash -n os/scripts/package-3ds-boot-assets.sh
          grep -Fq -- '--speed-time 30' os/scripts/package-3ds-boot-assets.sh
          grep -Fq -- '--continue-at -' os/scripts/package-3ds-boot-assets.sh
          grep -Fq '3dslinux.org/files/sd_files.tar.gz' os/scripts/package-3ds-boot-assets.sh
          grep -Fq '3dslinux.org/files/modules.tar' os/scripts/package-3ds-boot-assets.sh
          echo 'Installed and syntax-checked the bounded, resumable upstream asset downloader.'

      - name: Reclaim GitHub runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo docker system prune -af --volumes || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          df -h /
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( AVAIL_KB < 6000000 )); then
            echo "ERROR: Less than 6 GiB free before rootfs build." >&2
            exit 1
          fi

      - name: Install rootfs build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            curl ca-certificates file python3 python3-pil tar gzip coreutils \
            findutils binutils
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          sudo update-binfmts --enable qemu-arm || true

      - name: Run source static validation
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Patch rootfs packaging safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("os/build-rootfs.sh")
          s = p.read_text()
          # Stop copying live runner pseudo-filesystems into the target rootfs.
          # The source script mounts /dev, /proc and /sys for chroot package setup.
          overlay_copy = 'cp -a "$ROOT/os/rootfs-overlay/." "$ROOTFS/"'
          if overlay_copy not in s:
              raise SystemExit("Expected rootfs overlay copy not found; refusing unsafe automatic patch.")
          s = s.replace(
              overlay_copy,
              'cleanup\n' + overlay_copy,
              1,
          )
          old_copy = 'cp -a "$ROOTFS/." "$OUT/package/"'
          if old_copy not in s:
              raise SystemExit("Expected rootfs staging copy not found; refusing unsafe automatic patch.")
          s = s.replace(old_copy, 'mkdir -p "$OUT/package"', 1)
          # Archive directly from the generated rootfs: avoids a second full copy.
          # Exclude contents of virtual filesystems but retain their mount-point directories.
          lines = s.splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if re.match(r"\s*tar\b", line)), None)
          if start is None:
              raise SystemExit("Could not find the rootfs tar command; refusing partial patch.")
          end = start
          while end < len(lines) and "MiiNora-Debian-Bookworm-armel-rootfs.tar.gz" not in "".join(lines[start:end + 1]):
              end += 1
          if end >= len(lines):
              raise SystemExit("Could not find the rootfs archive output path; refusing partial patch.")
          block = "".join(lines[start:end + 1])
          if '-C "$OUT/package"' not in block:
              raise SystemExit("Rootfs tar command does not use the expected staging directory.")
          block = re.sub(
              r"^([ \t]*)tar\b",
              r"\1tar --one-file-system --numeric-owner --exclude='./proc/*' --exclude='./sys/*' --exclude='./dev/*' --exclude='./run/*'",
              block,
              count=1,
              flags=re.M,
          )
          block = block.replace('-C "$OUT/package"', '-C "$ROOTFS"', 1)
          lines[start:end + 1] = [block]
          s = "".join(lines)
          p.write_text(s)
          print("Rootfs archive now reads directly from ROOTFS and excludes virtual filesystem contents.")
          PY
          bash -n os/build-rootfs.sh
          grep -Fq 'cleanup' os/build-rootfs.sh
          if grep -Fq 'cp -a "$ROOTFS/." "$OUT/package/"' os/build-rootfs.sh; then
            echo "ERROR: unsafe rootfs copy remains." >&2
            exit 1
          fi
          echo "Verified: /dev, /proc and /sys are unmounted before rootfs packaging."

      - name: Build minimal Debian Bookworm armel root filesystem
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo bash ./os/build-rootfs.sh "$RUNNER_TEMP/miinora-rootfs"
          df -h /
          du -sh "$RUNNER_TEMP/miinora-rootfs" || true
          test -s "$RUNNER_TEMP/miinora-rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"

      - name: Package upstream Nintendo 3DS boot components and modules
        shell: bash
        run: |
          set -euo pipefail
          ./os/scripts/package-3ds-boot-assets.sh "$RUNNER_TEMP/miinora-os-package"

      - name: Assemble and validate OS release package
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/miinora-rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"
          PACKAGE="$RUNNER_TEMP/miinora-os-package"
          test -s "$ROOTFS"
          install -D -m 0644 "$ROOTFS" "$PACKAGE/rootfs/MiiNora-Debian-Bookworm-armel-rootfs.tar.gz"
          cp VERSION "$PACKAGE/VERSION"
          cat > "$PACKAGE/manifest.json" <<'JSON'
          {
            "name": "MiiNora OS",
            "version": "0.2.0-alpha",
            "target": "Nintendo 3DS Old model (CTR)",
            "userspace": "Debian Bookworm armel",
            "kernel_source": "Upstream 3DS-Linux SD files",
            "kernel_modules": "Matching upstream 3DS-Linux modules archive",
            "bootloader": "FIRM Linux Loader for Luma3DS",
            "root_filesystem": "ext4",
            "installer_note": "The CIA downloads the package to FAT32; install the rootfs to the prepared ext4 partition with os/install-on-linux-host.sh."
          }
          JSON
          test -s "$PACKAGE/fat32/linux/zImage"
          test -s "$PACKAGE/fat32/linux/nintendo3ds_ctr.dtb"
          test -s "$PACKAGE/fat32/linux/arm9linuxfw.bin"
          test -s "$PACKAGE/fat32/luma/payloads/firm_linux_loader.firm"
          test -s "$PACKAGE/modules/3ds-modules.tar"
          tar -tf "$PACKAGE/modules/3ds-modules.tar" | grep -Eq '^lib/modules/.+\\.ko(\\.xz|\\.gz)?$'
          ! find "$PACKAGE/fat32" -type l -print -quit | grep -q .
          ! find "$PACKAGE/fat32" -type f -name boot.firm -print -quit | grep -q .
          test "$(stat -c %s "$PACKAGE/fat32/linux/zImage")" -gt 524288
          test "$(stat -c %s "$PACKAGE/fat32/linux/nintendo3ds_ctr.dtb")" -gt 4096
          test "$(stat -c %s "$PACKAGE/fat32/linux/arm9linuxfw.bin")" -gt 2048
          test "$(stat -c %s "$PACKAGE/fat32/luma/payloads/firm_linux_loader.firm")" -gt 4096
          ROOTFS_TMP="$RUNNER_TEMP/rootfs-check"
          mkdir -p "$ROOTFS_TMP"
          tar -xzf "$ROOTFS" -C "$ROOTFS_TMP" ./usr/bin/dash
          readelf -h "$ROOTFS_TMP/usr/bin/dash" | grep -q 'Machine:.*ARM'
          rm -rf "$ROOTFS_TMP"
          echo "Disk usage before OS package archive:"
          df -h /
          du -sh "$PACKAGE" "$RUNNER_TEMP/miinora-rootfs" || true
          mkdir -p dist
          tar --sort=name --mtime='UTC 2024-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$PACKAGE" -czf dist/MiiNora-OS-Package.tar.gz .
          test "$(stat -c %s dist/MiiNora-OS-Package.tar.gz)" -gt 10485760
          sha256sum dist/MiiNora-OS-Package.tar.gz > dist/MiiNora-OS-Package.tar.gz.sha256
          file dist/MiiNora-OS-Package.tar.gz
          du -h dist/MiiNora-OS-Package.tar.gz

      - name: Upload OS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: miinora-os-package
          path: |
            dist/MiiNora-OS-Package.tar.gz
            dist/MiiNora-OS-Package.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-installer:
    name: Build native 3DS CIA and 3DSX
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:20260610
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore project source from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'MiiNora-OS-*-SOURCE.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: MiiNora source archive not found in repository root." >&2
            exit 1
          fi
          python3 - "$ARCHIVE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/miinora-source-extract" <<'PYTHON'
          import pathlib, shutil, sys, zipfile
          archive, workspace, extract = map(pathlib.Path, sys.argv[1:])
          workspace = workspace.resolve()
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (extract / item.filename).resolve()
                  if extract.resolve() not in target.parents and target != extract.resolve():
                      raise SystemExit(f"Unsafe path in source archive: {item.filename}")
                  zf.extract(item, extract)
                  mode = (item.external_attr >> 16) & 0o777
                  if mode and not item.is_dir():
                      target.chmod(mode)
          candidates = [p for p in extract.iterdir() if p.is_dir()]
          source = candidates[0] if len(candidates) == 1 else extract
          required = ["VERSION", "tests/validate-static.sh", "os/build-rootfs.sh",
                      "os/scripts/package-3ds-boot-assets.sh", "installer/Makefile",
                      "installer/source/main.c", "scripts/generate-assets.py"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Source archive is incomplete: " + ", ".join(missing))
          for item in source.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = workspace / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          PYTHON
          chmod +x tests/validate-static.sh os/build-rootfs.sh os/scripts/package-3ds-boot-assets.sh os/install-on-linux-host.sh
          test -s installer/source/main.c

      - name: Install resilient upstream 3DS asset downloader
        shell: bash
        run: |
          set -euo pipefail
          cat > os/scripts/package-3ds-boot-assets.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if [[ $# -ne 1 ]]; then
            echo "Usage: $0 <output-package-directory>" >&2
            exit 2
          fi

          OUT_INPUT="$1"
          mkdir -p "$OUT_INPUT"
          OUT="$(cd "$OUT_INPUT" && pwd)"
          WORK="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/miinora-3ds-boot-assets"
          mkdir -p "$WORK"

          # The official 3DS-Linux downloads page publishes these two archives.
          # Environment overrides exist only to make local regression tests possible.
          SD_URL="${MIINORA_SD_FILES_URL:-https://3dslinux.org/files/sd_files.tar.gz}"
          MODULES_URL="${MIINORA_MODULES_URL:-https://3dslinux.org/files/modules.tar}"
          SD_ARCHIVE="$WORK/sd_files.tar.gz"
          MODULES_ARCHIVE="$WORK/modules.tar"

          validate_archive() {
            local archive="$1"
            local kind="$2"

            python3 - "$archive" "$kind" <<'PYTHON'
          import pathlib
          import re
          import sys
          import tarfile

          archive_path = pathlib.Path(sys.argv[1])
          kind = sys.argv[2]

          try:
              mode = "r:gz" if kind == "sd" else "r:*"
              with tarfile.open(archive_path, mode) as tf:
                  members = tf.getmembers()
          except Exception as exc:
              raise SystemExit(f"Archive cannot be opened ({kind}): {exc}")

          if not members:
              raise SystemExit(f"Archive is empty ({kind}).")

          for member in members:
              name = member.name.replace("\\", "/")
              components = [part for part in name.split("/") if part not in ("", ".")]
              if name.startswith("/") or ".." in components:
                  raise SystemExit(f"Unsafe path in upstream archive: {member.name!r}")

          if kind == "sd":
              required = {
                  "zImage": 512 * 1024,
                  "nintendo3ds_ctr.dtb": 4096,
                  "arm9linuxfw.bin": 2048,
                  "firm_linux_loader.firm": 4096,
              }
              for basename, minimum_size in required.items():
                  matches = [m for m in members if m.isfile() and pathlib.PurePosixPath(m.name).name == basename]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected exactly one regular {basename} in sd_files.tar.gz; found {len(matches)}."
                      )
                  if matches[0].size <= minimum_size:
                      raise SystemExit(f"Upstream {basename} is unexpectedly small ({matches[0].size} bytes).")
          else:
              modules = []
              for member in members:
                  if not member.isfile():
                      continue
                  name = member.name
                  while name.startswith("./"):
                      name = name[2:]
                  if name.startswith("lib/modules/") and re.search(r"\.ko(?:\.(?:xz|gz))?$", name):
                      modules.append(name)
              if not modules:
                  raise SystemExit("modules.tar contains no lib/modules/*.ko, *.ko.xz or *.ko.gz files.")

          print(f"Validated {kind} archive: {archive_path.stat().st_size} bytes, {len(members)} entries")
          PYTHON
          }

          download_archive() {
            local url="$1"
            local destination="$2"
            local kind="$3"
            local partial="${destination}.part"
            local attempt delay rc

            for attempt in 1 2 3 4 5 6; do
              local args=(
                --fail
                --show-error
                --silent
                --location
                --http1.1
                --connect-timeout 20
                --max-time 600
                --retry 3
                --retry-connrefused
                --retry-all-errors
                --retry-delay 3
                --retry-max-time 60
                --speed-limit 1024
                --speed-time 30
                --keepalive-time 15
                --header 'Accept-Encoding: identity'
                --output "$partial"
              )

              if [[ -s "$partial" ]]; then
                args+=(--continue-at -)
                echo "[$kind] Resume attempt $attempt/6 from $(stat -c %s "$partial") bytes."
              else
                echo "[$kind] Download attempt $attempt/6."
              fi

              if curl "${args[@]}" "$url"; then
                if validate_archive "$partial" "$kind"; then
                  mv -f -- "$partial" "$destination"
                  echo "[$kind] Download complete: $(stat -c %s "$destination") bytes."
                  return 0
                fi
                echo "[$kind] Download returned an invalid archive; deleting it before retry." >&2
                rm -f -- "$partial"
              else
                rc=$?
                echo "[$kind] curl failed with exit code $rc." >&2
                # Exit 33 means the server refused a byte-range resume. Restart cleanly.
                if [[ "$rc" -eq 33 ]]; then
                  echo "[$kind] Server does not support this resume request; restarting from byte zero." >&2
                  rm -f -- "$partial"
                fi
              fi

              if [[ "$attempt" -lt 6 ]]; then
                case "$attempt" in
                  1) delay=5 ;;
                  2) delay=10 ;;
                  3) delay=20 ;;
                  4) delay=40 ;;
                  *) delay=60 ;;
                esac
                echo "[$kind] Waiting ${delay}s before retry."
                sleep "$delay"
              fi
            done

            echo "ERROR: Could not retrieve a valid official 3DS-Linux ${kind} archive after 6 attempts." >&2
            echo "No replacement kernel, DTB, firmware or modules were generated." >&2
            return 1
          }

          # A stalled connection is stopped after 30 seconds below 1 KiB/s. Partial
          # downloads are retained and resumed with HTTP Range where the server allows it.
          download_archive "$SD_URL" "$SD_ARCHIVE" sd
          download_archive "$MODULES_URL" "$MODULES_ARCHIVE" modules

          mkdir -p "$OUT/fat32/linux" "$OUT/fat32/luma/payloads" "$OUT/modules"

          python3 - "$SD_ARCHIVE" "$MODULES_ARCHIVE" "$OUT" <<'PYTHON'
          import pathlib
          import shutil
          import sys
          import tarfile

          sd_path = pathlib.Path(sys.argv[1])
          modules_path = pathlib.Path(sys.argv[2])
          out = pathlib.Path(sys.argv[3])

          mapping = {
              "zImage": (out / "fat32/linux/zImage", 512 * 1024),
              "nintendo3ds_ctr.dtb": (out / "fat32/linux/nintendo3ds_ctr.dtb", 4096),
              "arm9linuxfw.bin": (out / "fat32/linux/arm9linuxfw.bin", 2048),
              "firm_linux_loader.firm": (out / "fat32/luma/payloads/firm_linux_loader.firm", 4096),
          }

          with tarfile.open(sd_path, "r:gz") as tf:
              members = tf.getmembers()
              for basename, (destination, minimum_size) in mapping.items():
                  matches = [m for m in members if m.isfile() and pathlib.PurePosixPath(m.name).name == basename]
                  if len(matches) != 1:
                      raise SystemExit(f"Cannot safely select {basename}: found {len(matches)} matching files.")
                  member = matches[0]
                  if member.size <= minimum_size:
                      raise SystemExit(f"Refusing undersized {basename}: {member.size} bytes.")
                  stream = tf.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"Could not read {basename} from the official SD archive.")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with stream, destination.open("wb") as output:
                      shutil.copyfileobj(stream, output)
                  if destination.stat().st_size != member.size:
                      raise SystemExit(f"Extracted size mismatch for {basename}.")
                  print(f"Installed {destination.relative_to(out)} ({member.size} bytes)")

          with tarfile.open(modules_path, "r:*") as tf:
              members = tf.getmembers()
              module_names = []
              for member in members:
                  if not member.isfile():
                      continue
                  name = member.name
                  while name.startswith("./"):
                      name = name[2:]
                  if name.startswith("lib/modules/") and name.endswith((".ko", ".ko.xz", ".ko.gz")):
                      module_names.append(name)
              if not module_names:
                  raise SystemExit("Refusing to package modules.tar without actual kernel module files.")

          shutil.copy2(modules_path, out / "modules/3ds-modules.tar")
          print(f"Packaged {len(module_names)} kernel modules from the official archive.")
          PYTHON

          # Final output gate: every expected binary must exist and remain non-empty.
          test "$(stat -c %s "$OUT/fat32/linux/zImage")" -gt 524288
          test "$(stat -c %s "$OUT/fat32/linux/nintendo3ds_ctr.dtb")" -gt 4096
          test "$(stat -c %s "$OUT/fat32/linux/arm9linuxfw.bin")" -gt 2048
          test "$(stat -c %s "$OUT/fat32/luma/payloads/firm_linux_loader.firm")" -gt 4096
          test -s "$OUT/modules/3ds-modules.tar"
          sha256sum "$SD_ARCHIVE" "$MODULES_ARCHIVE" | tee "$OUT/upstream-SHA256SUMS"
          echo "Official 3DS-Linux boot assets and matching modules packaged successfully."
          SCRIPT
          chmod +x os/scripts/package-3ds-boot-assets.sh
          bash -n os/scripts/package-3ds-boot-assets.sh
          grep -Fq -- '--speed-time 30' os/scripts/package-3ds-boot-assets.sh
          grep -Fq -- '--continue-at -' os/scripts/package-3ds-boot-assets.sh
          grep -Fq '3dslinux.org/files/sd_files.tar.gz' os/scripts/package-3ds-boot-assets.sh
          grep -Fq '3dslinux.org/files/modules.tar' os/scripts/package-3ds-boot-assets.sh
          echo 'Installed and syntax-checked the bounded, resumable upstream asset downloader.'

      - name: Install Python image dependency for static validation
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil

      - name: Run source static validation
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Install build utilities and verify devkitARM tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip zip file
          apt-get install -y --no-install-recommends binutils-arm-none-eabi || true
          test -n "${DEVKITPRO:-}"
          test -n "${DEVKITARM:-}"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          STRIP="$DEVKITARM/bin/arm-none-eabi-strip"
          if [[ ! -x "$STRIP" ]]; then STRIP="$(command -v arm-none-eabi-strip || true)"; fi
          if [[ -z "$STRIP" || ! -x "$STRIP" ]]; then
            echo "ERROR: arm-none-eabi-strip is missing." >&2
            find "$DEVKITPRO" -maxdepth 5 -name 'arm-none-eabi-strip' -print || true
            exit 1
          fi
          echo "ARM_STRIP=$STRIP" >> "$GITHUB_ENV"
          test -f "$DEVKITARM/3ds_rules"
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          "$STRIP" --version

      - name: Run source static validation again
        shell: bash
        run: bash ./tests/validate-static.sh

      - name: Generate custom MiiNora branding assets
        shell: bash
        run: python3 scripts/generate-assets.py

      - name: Build native installer
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", tag):
              raise SystemExit("Invalid release tag")
          source = Path("installer/source/main.c")
          text = source.read_text()
          text = re.sub(r'#define PACKAGE_URL "[^"]+"',
                        f'#define PACKAGE_URL "https://github.com/sl4m3d/miinoraOS/releases/download/{tag}/MiiNora-OS-Package.tar.gz"',
                        text, count=1)
          source.write_text(text)
          PYCODE
          if ! make -C installer clean all 2>&1 | tee "$RUNNER_TEMP/miinora-installer-build.log"; then
            echo "Installer compilation failed. Last 160 lines follow:" >&2
            tail -n 160 "$RUNNER_TEMP/miinora-installer-build.log" >&2 || true
            exit 1
          fi
          test -s installer/MiiNora-Installer.elf
          test -s installer/MiiNora-Installer.3dsx

      - name: Download CIA packaging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/3ds-tools"
          cd "$RUNNER_TEMP/3ds-tools"
          curl --fail --show-error --silent --location --http1.1 \
            --connect-timeout 20 --max-time 240 --speed-limit 1024 --speed-time 30 \
            --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 600 \
            -o makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl --fail --show-error --silent --location --http1.1 \
            --connect-timeout 20 --max-time 240 --speed-limit 1024 --speed-time 30 \
            --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 600 \
            -o bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          mkdir makerom bannertool
          unzip -q makerom.zip -d makerom
          unzip -q bannertool.zip 'linux-x86_64/bannertool' -d bannertool
          MAKEROM_BIN="$(find makerom -type f -name makerom -print -quit)"
          BANNER_BIN="bannertool/linux-x86_64/bannertool"
          test -n "$MAKEROM_BIN"
          test -s "$BANNER_BIN"
          chmod +x "$MAKEROM_BIN" "$BANNER_BIN"
          echo "MAKEROM=$RUNNER_TEMP/3ds-tools/$MAKEROM_BIN" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$RUNNER_TEMP/3ds-tools/$BANNER_BIN" >> "$GITHUB_ENV"

      - name: Package CIA and 3DSX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$BANNERTOOL" makesmdh -s "MiiNora Installer" -l "MiiNora OS setup utility" -p "sl4m3d" -i installer/assets/icon.png -o dist/MiiNora.smdh
          "$BANNERTOOL" makebanner -i installer/assets/banner.png -a installer/assets/banner.wav -o dist/MiiNora.bnr
          "$ARM_STRIP" installer/MiiNora-Installer.elf
          cat > dist/MiiNora-Installer.rsf <<'RSF'
          BasicInfo:
            Title: "MiiNora Installer"
            ProductCode: "MiiNora"
            Logo: Homebrew
          TitleInfo:
            Category: Application
            UniqueId: 0xF00A1
          Option:
            UseOnSD: true
            FreeProductCode: true
            MediaFootPadding: false
            EnableCrypt: false
            EnableCompress: true
          RSF
          "$MAKEROM" -f cia -o dist/MiiNora-Installer.cia -rsf dist/MiiNora-Installer.rsf -target t -exefslogo \
            -elf installer/MiiNora-Installer.elf -icon dist/MiiNora.smdh -banner dist/MiiNora.bnr -desc app:4
          cp installer/MiiNora-Installer.3dsx dist/
          cp README.md VERSION dist/
          (cd "$GITHUB_WORKSPACE" && zip -qr "$GITHUB_WORKSPACE/dist/MiiNora-Source.zip" . \
            -x '.git/*' 'dist/*' '*/__pycache__/*' '*.pyc')
          test -s dist/MiiNora-Installer.cia
          test -s dist/MiiNora-Installer.3dsx
          test -s dist/MiiNora-Source.zip
          file dist/MiiNora-Installer.cia dist/MiiNora-Installer.3dsx

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: miinora-installer
          path: |
            dist/MiiNora-Installer.cia
            dist/MiiNora-Installer.3dsx
            dist/MiiNora-Source.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish complete MiiNora release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-os, build-installer]
    steps:
      - name: Download OS package
        uses: actions/download-artifact@v4
        with:
          name: miinora-os-package
          path: release/os

      - name: Download installer files
        uses: actions/download-artifact@v4
        with:
          name: miinora-installer
          path: release/installer

      - name: Assemble checksums and verify release contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/os/* dist/
          cp release/installer/* dist/
          test -s dist/MiiNora-OS-Package.tar.gz
          test -s dist/MiiNora-Installer.cia
          test -s dist/MiiNora-Installer.3dsx
          test -s dist/MiiNora-Source.zip
          (cd dist && sha256sum MiiNora-OS-Package.tar.gz MiiNora-Installer.cia MiiNora-Installer.3dsx MiiNora-Source.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
          name: MiiNora OS ${{ inputs.release_tag != '' && inputs.release_tag || format('v0.2.0-alpha.{0}', github.run_number) }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: |
            dist/MiiNora-Installer.cia
            dist/MiiNora-Installer.3dsx
            dist/MiiNora-OS-Package.tar.gz
            dist/MiiNora-OS-Package.tar.gz.sha256
            dist/MiiNora-Source.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full release bundle for CI inspection
        uses: actions/upload-artifact@v4
        with:
          name: MiiNora-Release-Bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
