name: Build MiiNora Alpha and publish release

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miinora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install devkitPro toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates unzip python3 python3-pil make
          curl -fsSLo install-devkitpro-pacman https://apt.devkitpro.org/install-devkitpro-pacman
          sudo bash ./install-devkitpro-pacman
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "CTRULIB=/opt/devkitpro/libctru" >> "$GITHUB_ENV"

      - name: Download pinned packaging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/3ds-tools"
          cd "$RUNNER_TEMP/3ds-tools"
          curl -fL --retry 3 -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -fL --retry 3 -o bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          mkdir makerom bannertool
          unzip -q makerom.zip -d makerom
          unzip -q bannertool.zip -d bannertool
          MAKEROM_BIN="$(find makerom -type f -name makerom | head -n 1)"
          BANNER_BIN="$(find bannertool -type f -name bannertool | head -n 1)"
          test -n "$MAKEROM_BIN"
          test -n "$BANNER_BIN"
          chmod +x "$MAKEROM_BIN" "$BANNER_BIN"
          echo "MAKEROM=$RUNNER_TEMP/3ds-tools/$MAKEROM_BIN" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$RUNNER_TEMP/3ds-tools/$BANNER_BIN" >> "$GITHUB_ENV"

      - name: Generate artwork
        run: python3 scripts/generate-assets.py

      - name: Build native 3DS homebrew executable
        run: make -C installer clean all

      - name: Package installable CIA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$BANNERTOOL" makesmdh -s "MiiNora Installer" -l "MiiNora OS Alpha installer" -p "sl4m3d" -i installer/assets/icon.png -o dist/MiiNora.smdh
          "$BANNERTOOL" makebanner -i installer/assets/banner.png -a installer/assets/banner.wav -o dist/MiiNora.bnr
          arm-none-eabi-strip installer/MiiNora-Installer.elf
          "$MAKEROM" -f cia -o dist/MiiNora-Installer.cia -target t -exefslogo -elf installer/MiiNora-Installer.elf -icon dist/MiiNora.smdh -banner dist/MiiNora.bnr -desc app:4
          cp installer/MiiNora-Installer.3dsx dist/
          cp README.md VERSION dist/
          git archive --format=zip --prefix=miinoraOS/ HEAD -o dist/MiiNora-Source.zip
          (cd dist && sha256sum MiiNora-Installer.cia MiiNora-Installer.3dsx MiiNora-Source.zip > SHA256SUMS)

      - name: Verify output files
        run: |
          test -s dist/MiiNora-Installer.cia
          test -s dist/MiiNora-Installer.3dsx
          test -s dist/MiiNora-Source.zip
          test -s dist/SHA256SUMS
          file dist/MiiNora-Installer.cia
          cat dist/SHA256SUMS

      - name: Create GitHub release and upload build artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.${{ github.run_number }}
          name: "MiiNora OS 0.1 Alpha #${{ github.run_number }}"
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist/MiiNora-Installer.cia
            dist/MiiNora-Installer.3dsx
            dist/MiiNora-Source.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow build report
        uses: actions/upload-artifact@v4
        with:
          name: MiiNora-Alpha-Build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
